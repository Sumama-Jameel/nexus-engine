# Nexus Protocol — golangci-lint Configuration
# Calibrated to the codebase's actual baseline (see scripts/coverage-ratchet.sh
# for the same philosophy on test coverage). License headers are enforced by
# scripts/check-license-headers.sh, not by the lint gate.

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
    - gosec
    - gofmt
    - goimports
    - misspell
    - ineffassign
    - unused
    - gosimple
  disable:
    - errcheck # Return values deliberately ignored in several hot paths (audit/state logging); calibrate before re-enabling

linters-settings:
  gosec:
    excludes:
      - G104 # Audit errors not checked (too many false positives for CLI tools)
      - G115 # int64 -> uint64 size conversions (disk stats are never negative)
      - G301 # Directory permissions (config dirs use 0755 by design)
      - G302 # File permissions (0744/0644 used for user-owned config)
      - G304 # File inclusion via variable (manifest store reads user-specified paths)
      - G306 # WriteFile permissions (profile/state files use 0644 by design)
  misspell:
    locale: US
    ignore-words:
      - cancelled
      - organisation
      - initialised
  staticcheck:
    checks:
      - all
      - "-SA9003" # Empty branches: intentional non-fatal error swallowing with comments

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-use-default: false
  exclude-rules:
    # Test fixtures/scaffolds tolerate unused fields, fake credentials, and
    # nil-context helpers without masking production-code problems.
    - path: _test\.go$
      linters:
        - unused
        - gosec
        - staticcheck
    - path: _test\.go$
      text: "SA1012"
    - path: _test\.go$
      text: "SA1019"
    - path: _test\.go$
      text: "SA4006"

severity:
  default-severity: warning